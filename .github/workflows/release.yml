name: Release

# A release is cut by pushing a tag: scripts/release.sh vX.Y.Z[-rc.N]. This is the
# only workflow that publishes a versioned workspace image. Anyone can read its
# run in GitHub Actions.
#
# The image bakes the RunOS CLI environment in at build time (the RUNOS_ENV build
# argument). A release candidate bakes dev. A final bakes beta, as the build of the
# main branch did before releases were tagged. So a final is a new build of the
# same commit, never a re-tag of the candidate image.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/runos-official/runostty

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Work out what kind of release this is
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # A semver pre-release suffix (-rc.N) marks a release candidate: it is
          # published and pinnable by exact version, flagged a GitHub pre-release,
          # and it moves the :dev tag. Only a final moves :latest.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "runos_env=dev" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "runos_env=beta" >> "$GITHUB_OUTPUT"
          fi

      # The tag and package.json must name the same version, so the number inside
      # the image is the number on the tag.
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="${TAG#v}"; base="${base%%-*}"
          have="$(node -p "require('./package.json').version")"
          if [ "$have" != "$base" ]; then
            echo "package.json says $have, but the tag $TAG needs $base"
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          tags="${IMAGE_NAME}:${VERSION}"
          if [ "$PRERELEASE" = "true" ]; then
            tags="${tags},${IMAGE_NAME}:dev"
          else
            major_minor="${VERSION%.*}"
            tags="${tags},${IMAGE_NAME}:${major_minor},${IMAGE_NAME}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNOS_ENV=${{ steps.version.outputs.runos_env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless Sigstore build-provenance attestation bound to the image digest and
      # this workflow's OIDC identity. Verify with:
      #   gh attestation verify oci://ghcr.io/runos-official/runostty:<v> --repo runos-official/runostty
      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES=$(awk "
            /^## ${VERSION}\$/ { found=1; next }
            found && /^## /  { exit }
            found            { print }
          " CHANGELOG.md | awk 'NF{p=1} p')
          if [ -z "$NOTES" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > release_notes.txt
          fi

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release_notes.txt' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          draft: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
