# The RunOS terminal server release pipeline (candidate and final), run by foreman on
# the foreman HOST.
#
# This repo is PUBLIC and its image is built by GitHub Actions (release.yml), not
# here, so the public sees the same process that foreman shows. Foreman runs the
# repo's own gate script in check mode, tags and pushes, WATCHES the workflow the
# tag started, verifies what it published, and records the release.
#
# The record. `deployed` holds the last commit that was tagged, a candidate or a
# final. A candidate moves `deployed` and nothing else. A FINAL moves `deployed`
# and also fast-forwards `main`, the prod record, to the commit the final's tag
# names. The dev target carries `deployed_branch: deployed`. The prod target
# carries `deployed_branch: main`. scripts/deploy/record-release.sh holds both
# rules, refuses a record that does not fit the env, and refuses anything but a
# fast-forward. It never forces and it deletes no branch.
#
# A FINAL is never cut from fresh code. It is cut from the exact commit that
# shipped as a release candidate and is recorded as shipped (step two). The final
# image is a new build of that same commit (it bakes a different CLI environment
# than a candidate); it moves the :latest tag, a candidate moves :dev.
#
# Nothing here rolls a pod. Conductor starts one pod per user from the image
# that its configuration names: the floating tag :dev on dev and :latest on prod.
# A release candidate moves :dev, a final moves :latest. A new image reaches a
# workspace when its pod starts. A rollback is a new version: published tags are
# never deleted.
#
# gh authenticates from the host keyring, so no credential is injected here.
#
# scripts/deploy/check-pipelines.py loads every file in this folder against the
# schema foreman validates them with.

name: Release the RunOS terminal server
description: Run this repo's full gate chain, tag and push, watch the GitHub Actions release, verify the image and its attestation, and record the release.
kind: github_release

steps:
  - name: Version and target agree
    description: "A dev target takes a release candidate (vX.Y.Z-rc.N), a prod target takes a final (vX.Y.Z). The target integrates on dev, which is all scripts/release.sh uses. The next step checks that the target's record fits its env."
    run: |
      version="${{ version }}"
      printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "version $version must look like v1.2.3 or v1.2.3-rc.1"; exit 1; }
      case "${{ target.env }}" in
        prod) case "$version" in *-*) echo "prod takes a final such as v1.2.3, not $version"; exit 1;; esac ;;
        dev)  case "$version" in *-rc.*) ;; *) echo "dev takes a candidate such as v1.2.3-rc.1, not $version"; exit 1;; esac ;;
        *) echo "unknown target env: ${{ target.env }}"; exit 1 ;;
      esac
      test "${{ target.branch }}" = "dev" || { echo "this target integrates on ${{ target.branch }}, but scripts/release.sh releases only from dev"; exit 1; }
      echo "$version on a ${{ target.env }} target"
    timeout: 60

  - name: Final comes from the validated candidate
    description: A final version (no -rc) must be cut from the exact commit that shipped as a release candidate and that `deployed` records. If dev has moved on since, the final would carry code no candidate validated. A final on a prod target must also be able to fast-forward main, so main must be an ancestor of dev. The target's record must fit its env. A candidate passes straight through.
    run: scripts/deploy/record-release.sh check "${{ version }}" "${{ target.env }}" "${{ target.branch }}" "${{ target.deployed_branch }}"
    timeout: 120

  - name: Gate chain
    description: "scripts/release.sh --check: preflight (tag free, CHANGELOG section, clean tree, branch in sync, CI green on the commit), the sensitivity scan, the leak and scannability gates, the package version, npm ci, npm run check and the unit tests. Every gate, no side effects, and it cannot be skipped."
    run: scripts/release.sh "${{ version }}" --check
    timeout: 1800
    slow: true

  - name: Tag and push
    description: Tags the integration branch and pushes both. The record is not touched here; the last step moves it once the release is verified.
    run: |
      git checkout --quiet ${{ target.branch }}
      sha="$(git rev-parse --short HEAD)"
      git tag "${{ version }}"
      git push --quiet origin ${{ target.branch }}
      git push --quiet origin "${{ version }}"
      echo "tagged ${{ version }} at $sha and pushed"

  - name: Wait for the release workflow
    description: GitHub builds the image. Find the run this tag started, print its address, then block on it. A failed workflow fails the deploy.
    run: scripts/deploy/watch-release.sh "${{ version }}"
    timeout: 1800
    expect: [run_id, workflow_run_url, conclusion, jobs]
    observe: workflow_run_url is the run the public sees in GitHub Actions. conclusion must be success; jobs lists each job with its own conclusion.

  - name: Verify the published release
    description: Proves the release page, the image and its platforms exist, and that the attestation was signed by THIS workflow at THIS tag for the commit the tag names.
    run: scripts/deploy/verify-release.sh "${{ version }}"
    timeout: 300
    expect: [image, digest, platforms, attestation, attested_commit]
    observe: digest is the image to pin. platforms must list linux/amd64. attested_commit must be the tagged commit.

  - name: Record the release
    description: "Only now, on success. A candidate fast-forwards deployed. A final fast-forwards deployed and main to the commit the final's tag names, and refuses anything that is not a fast-forward. Nothing is forced."
    run: scripts/deploy/record-release.sh advance "${{ version }}" "${{ target.env }}" "${{ target.branch }}" "${{ target.deployed_branch }}"
    timeout: 120
    expect: [main_before, main_after, main_equals_final]
    observe: Printed for a final on a prod target only. main_after must equal the final's tagged commit and main_equals_final must be true. main_before is what main held before.

  # Read-only, runs even after a failure or a cancel, prints data and no verdict. The agent decides.
  - name: Collect evidence
    description: "Read-only. The tag and its commit, the workflow run with every job and step, the failed log tail, the release page, the image digest and platforms, the attestation. Prints data only."
    always: true
    timeout: 120
    run: scripts/deploy/release-evidence.sh "${{ version }}" "${{ run_dir }}/evidence.txt"
